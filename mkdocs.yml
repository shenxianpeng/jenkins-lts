site_name: Jenkins LTS upgrade guides
site_url: https://shenxianpeng.github.io/jenkins-lts/
site_description: Jenkins LTS upgrade guides written by starting version, in English and Chinese.
site_author: Xianpeng Shen
repo_url: https://github.com/shenxianpeng/jenkins-lts
edit_uri: edit/main/docs/

theme:
  name: sumi

plugins:
  - search
  - llms_txt
  - sumi

markdown_extensions:
  - attr_list
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - "2.580": 2-580.md

languages:
  en: English
  zh:
    name: 简体中文
    site_name: Jenkins LTS 升级指南
    site_description: 按"你从哪个版本升"来写的 Jenkins LTS 中文升级指南。
    nav:
      - 首页: index.md
      - "2.580": 2-580.md
